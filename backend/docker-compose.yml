# Environnement local complet : données fictives seulement (règle 7).
# docker compose up -d && docker compose exec web python manage.py migrate
x-app: &app
  build: .
  env_file: .env
  depends_on: [postgres, redis]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caef}
      POSTGRES_USER: ${POSTGRES_USER:-caef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes: [postgres:/var/lib/postgresql/data]

  redis:
    image: redis:7

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?définir S3_ACCESS_KEY dans .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?définir S3_SECRET_KEY dans .env}
    volumes: [minio:/data]

  web:
    <<: *app
    depends_on: [postgres, redis, minio]

  worker:
    <<: *app
    command: celery -A config worker -l info

  beat:
    <<: *app
    command: celery -A config beat -l info

  nginx:
    image: nginx:1.27
    ports: ["8080:80"]
    volumes: ["./deploiement/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web]

volumes:
  postgres:
  minio:
