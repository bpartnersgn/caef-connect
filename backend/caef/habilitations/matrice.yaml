  RC:  {libelle: Responsable de centre, titre: Responsable du centre, double_auth: recommandee, hors_ligne: true}
  RA:  {libelle: Responsable adjoint de centre, titre: Adjoint du responsable, double_auth: recommandee, hors_ligne: true}
  AA:  {libelle: Agent administratif, titre: Assistante de la responsable du centre, double_auth: non, hors_ligne: true}
  RP:  {libelle: Responsable pédagogique, titre: Responsable pédagogique, double_auth: non, hors_ligne: true}
  FO:  {libelle: Formateur, titre: Moniteur, double_auth: non, hors_ligne: true}
  RSE: {libelle: Responsable RSE et partenariats, titre: Responsable RSE et partenariats, double_auth: recommandee, hors_ligne: false}
  SE:  {libelle: Responsable suivi-évaluation, titre: Responsable suivi-évaluation, double_auth: recommandee, hors_ligne: false}
  CPT: {libelle: Comptable de centre, titre: Chef comptable, double_auth: obligatoire, hors_ligne: true}
  VB:  {libelle: Vendeur ou vendeuse de boutique, titre: Gérante de la salle d'exposition et de la boutique, double_auth: non, hors_ligne: true, module: boutique}
  CMT: {libelle: Chef matériels, titre: Chef matériels, double_auth: non, hors_ligne: false}

