# Matrice des rôles et permissions CAEF Connect, en fichier de données.
#
# Source : docs/04 - Matrice des rôles et permissions (version du 13/10/2026).
# Ce fichier est la seule source des droits : la table `permission`, les contrôles
# côté serveur et les tests de droits (un test par cellule) en sont dérivés.
# Tout droit absent est refusé (principe de moindre privilège).
#
# Syntaxe d'une cellule : actions séparées par des espaces, puis le périmètre entre parenthèses.
#   Actions  : L consulter, C créer, M modifier, V valider, E exporter, A archiver ou clôturer.
#   V*       : validation que le RA n'exerce que pendant un intérim déclaré (règle 6).
#   V~       : validation « à défaut de CPT » (clôture de caisse) : seulement si le centre
#              n'a aucun comptable actif.
#   Périmètre: (s) ses sessions, (c) ses centres (par défaut), (n) réseau,
#              (ag) agrégé sans données nominatives, (p) sa propre fiche.
#
# `module` : socle (toujours actif) ou module optionnel activable par centre (règle 9) :
#   boutique, salle_exposition, scolarite_paiements, rse_centre.
# `centre` : faux pour un objet national, sans centre (référentiels, catalogue national…).

version: "2026-10-13"

roles:
  ADM: {libelle: Administrateur national, titre: Administrateur national, double_auth: obligatoire, hors_ligne: false}
